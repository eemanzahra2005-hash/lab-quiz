<!-- Lab Quiz 01 - Q2: Hospital Appointment System (Frontend) -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Appointment System</title>
  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-teal">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Hospital Appointment System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#book">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="#appointments">Appointments</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-4">

      <!-- Book Appointment form -->
      <section class="col-12 col-lg-4" id="book">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h4 card-title mb-3">Book Appointment</h2>
            <form id="appointmentForm" novalidate>
              <div class="mb-3">
                <label for="patientName" class="form-label">Patient Name</label>
                <input type="text" id="patientName" class="form-control" placeholder="e.g. Usman Ali">
                <div class="error-msg" id="patientNameError"></div>
              </div>
              <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" id="date" class="form-control">
                <div class="error-msg" id="dateError"></div>
              </div>
              <div class="mb-3">
                <label for="reason" class="form-label">Reason (optional)</label>
                <input type="text" id="reason" class="form-control" placeholder="e.g. Chest pain">
              </div>
              <div class="mb-3">
                <label for="doctorId" class="form-label">Doctor</label>
                <select id="doctorId" class="form-select">
                  <option value="">-- Select doctor --</option>
                </select>
                <div class="error-msg" id="doctorIdError"></div>
              </div>
              <button type="submit" class="btn btn-teal w-100">Book Appointment</button>
              <div class="error-msg mt-2" id="serverError"></div>
            </form>
          </div>
        </div>
      </section>

      <!-- Appointments table -->
      <section class="col-12 col-lg-8" id="appointments">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h4 card-title mb-3">Appointments</h2>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Patient</th>
                    <th>Date</th>
                    <th>Reason</th>
                    <th>Doctor</th>
                    <th>Status</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="appointmentList"></tbody>
              </table>
            </div>
            <p class="text-muted mt-3 mb-0" id="emptyMsg">No appointments yet.</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="text-center text-muted py-3 border-top">
    Eeman Zahra | BSCS-V-C
  </footer>

  <!-- Bootstrap 5 JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
