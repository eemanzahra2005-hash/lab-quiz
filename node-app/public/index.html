<!-- Lab Quiz 01 - Q1: Event Registration Manager (Frontend) -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration Manager</title>
  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Event Registration Manager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#register">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="#attendees">Attendees</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-4">

      <!-- Register Attendee form -->
      <section class="col-12 col-lg-4" id="register">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h4 card-title mb-3">Register Attendee</h2>
            <form id="attendeeForm" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder="e.g. Ali Khan">
                <div class="error-msg" id="nameError"></div>
              </div>
              <div class="mb-3">
                <label for="event" class="form-label">Event</label>
                <input type="text" id="event" class="form-control" placeholder="e.g. Tech Conference">
                <div class="error-msg" id="eventError"></div>
              </div>
              <div class="mb-3">
                <label for="ticketType" class="form-label">Ticket Type</label>
                <select id="ticketType" class="form-select">
                  <option value="">-- Select --</option>
                  <option value="Regular">Regular</option>
                  <option value="VIP">VIP</option>
                  <option value="Student">Student</option>
                </select>
                <div class="error-msg" id="ticketTypeError"></div>
              </div>
              <div class="mb-3">
                <label for="ticketPrice" class="form-label">Ticket Price (Rs.)</label>
                <input type="number" id="ticketPrice" class="form-control" placeholder="e.g. 1500" min="1">
                <div class="error-msg" id="ticketPriceError"></div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Add Attendee</button>
              <div class="error-msg mt-2" id="serverError"></div>
            </form>
          </div>
        </div>
      </section>

      <!-- Attendees list + Total Revenue -->
      <section class="col-12 col-lg-8" id="attendees">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h2 class="h4 mb-0">Attendees</h2>
          <span class="badge bg-success fs-6">Total Revenue: Rs. <span id="totalRevenue">0</span></span>
        </div>
        <div class="row g-3" id="attendeeList"></div>
        <p class="text-muted" id="emptyMsg">No attendees yet.</p>
      </section>

    </div>
  </main>

  <footer class="text-center text-muted py-3 border-top">
    Eeman Zahra | BSCS-V-C
  </footer>

  <!-- Bootstrap 5 JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
